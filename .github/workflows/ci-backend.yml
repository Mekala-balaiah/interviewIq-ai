name: 🔄 CI — Backend Build & Test

on:
  push:
    branches: [ main, develop, 'sprint/**' ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1024m'

jobs:

  # ============================================================
  # Job 1: Build & Compile
  # ============================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔨 Compile
        working-directory: backend
        run: mvn compile -q -B

      - name: 📦 Package (skip tests)
        working-directory: backend
        run: mvn package -DskipTests -q -B

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ============================================================
  # Job 2: Unit Tests
  # ============================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 🧪 Run unit tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: test-secret-key-for-github-actions-minimum-256-bits
          DATASOURCE_URL: jdbc:h2:mem:testdb
          DATASOURCE_USERNAME: sa
          DATASOURCE_PASSWORD: ''
        run: mvn test -B --no-transfer-progress

      - name: 📊 Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

      - name: 📤 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  # ============================================================
  # Job 3: Integration Tests (with Docker services)
  # ============================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: interviewiq_db
          POSTGRES_USER: interviewiq
          POSTGRES_PASSWORD: interviewiq_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔗 Run integration tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/interviewiq_db
          DATASOURCE_USERNAME: interviewiq
          DATASOURCE_PASSWORD: interviewiq_pass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-github-actions-minimum-256-bits
        run: mvn verify -P integration-tests -B --no-transfer-progress

      - name: 📤 Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: backend/target/failsafe-reports/
          retention-days: 7

  # ============================================================
  # Job 4: Code Quality
  # ============================================================
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔍 Run Checkstyle
        working-directory: backend
        run: mvn checkstyle:check -B -q || true

      - name: 🔐 Check for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ============================================================
  # Job 5: Sprint Status Comment
  # ============================================================
  sprint-status:
    name: 📊 Sprint Status
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Post sprint status comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = require('fs').readFileSync('VERSION', 'utf8').trim();
            const body = `## ✅ CI Passed — InterviewIQ AI v${version}
            
            | Check | Status |
            |-------|--------|
            | 🏗️ Build | ✅ Passed |
            | 🧪 Unit Tests | ✅ Passed |
            | 📦 Artifact | ✅ Uploaded |
            
            **Branch:** \`${{ github.head_ref }}\`
            **Commit:** \`${{ github.sha }}\`
            
            > Ready for merge to \`main\` ✅`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
